# Weekly dependency and action updates. Grouped so a week is one PR per
# ecosystem, not twenty. CI (verify.yml) is the gate for each.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
