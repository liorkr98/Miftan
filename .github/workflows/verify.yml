# Typecheck, lint, build and test on every push and pull request.
#
# This exists because the primary dev machine cannot run npm — endpoint
# protection kills the install — so nothing is verified locally. Until this
# workflow is green, a change is unverified, whatever it looks like.

name: verify

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miftan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/miftan_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The seed is not covered by the tests, and a broken seed is only found
      # the day someone resets the demo. Run it against a clean database here.
      - name: Seed smoke test
        run: |
          npm run db:reset -w @miftan/api
          npm run db:migrate -w @miftan/api
          npm run db:seed -w @miftan/api
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/miftan_test
          JWT_SECRET: seed-only-placeholder-that-is-long-enough-to-validate
          DEMO_DATABASE: 'true'
          CONFIRM_RESET: erase-demo-database
