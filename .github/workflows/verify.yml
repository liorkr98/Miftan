# Typecheck, lint, build and test on every push and pull request.
#
# This exists because the primary dev machine cannot run npm — endpoint
# protection kills the install — so nothing is verified locally. Until this
# workflow is green, a change is unverified, whatever it looks like.

name: verify

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Known-vulnerable runtime dependencies fail the build. Dev tooling is
      # excluded: it never ships.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # On failure the last lines also go out as annotations, which can be
      # read through the API without downloading the log.
      - name: Build
        run: |
          npm run build > build.log 2>&1 || {
            cat build.log
            grep -iE 'error|fail|could not|cannot' build.log | grep -v '^    at ' | head -n 8 | sed 's/^/::error::/'
            exit 1
          }
          cat build.log

      - name: Test
        run: npm test

      # The schema and the committed migrations must agree: a schema change
      # without `npm run db:generate -w @miftan/api` leaves new SQL here.
      - name: Migrations up to date
        working-directory: apps/api
        run: |
          npx drizzle-kit generate --name ci-check
          git status --porcelain migrations
          test -z "$(git status --porcelain migrations)"

      # The Worker that Cloudflare deploys, bundled exactly as it will be —
      # an import the Workers runtime cannot resolve fails here, not live.
      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run --outdir /tmp/worker

      # The seed is not covered by the tests, and a broken seed is only found
      # the day someone resets the demo. Run it against a clean local D1 here.
      - name: Seed smoke test
        run: |
          npm run db:reset
          npm run db:seed
