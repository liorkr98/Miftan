# One environment for now: the Fly app `miftan` and the Neon database that
# exists today. The API deploys automatically after verify is green on main,
# so it no longer lags the web app (Cloudflare deploys the web on every push).
# It can also be run by hand from the Actions tab.
#
# reset-demo erases the database and reloads the demo data. It needs the
# typed confirmation, and the seed guard still refuses a database that holds
# real sign-ups (apps/api/src/db/demo-guard.ts).
#
# Secrets: FLY_API_TOKEN, NEON_DATABASE_URL (pooled), NEON_DIRECT_URL.
# RESEND_API_KEY is set on the Fly app directly.
#
# A separate production environment will come back later as its own job.

name: deploy

on:
  workflow_dispatch:
    inputs:
      data:
        description: 'keep = migrations only. reset-demo erases the database and reloads demo data.'
        type: choice
        options:
          - keep
          - reset-demo
        default: keep
      confirm:
        description: 'For reset-demo, type erase-demo-database'
        required: false
        default: ''
      web_origin:
        description: 'Web origin for CORS. Leave empty for the default.'
        required: false
        default: ''
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Refuse a reset that was not typed out
        if: ${{ inputs.data == 'reset-demo' }}
        run: |
          if [ "$CONFIRM" != "erase-demo-database" ]; then
            echo "reset-demo requires confirm=erase-demo-database" >&2
            exit 1
          fi
        env:
          CONFIRM: ${{ inputs.confirm }}

      - name: Reset database
        if: ${{ inputs.data == 'reset-demo' }}
        run: npm run db:reset -w @miftan/api
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
          DEMO_DATABASE: 'true'
          CONFIRM_RESET: erase-demo-database

      - name: Migrate
        run: npm run db:migrate -w @miftan/api
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}

      - name: Seed demo data
        if: ${{ inputs.data == 'reset-demo' }}
        run: npm run db:seed -w @miftan/api
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
          DEMO_DATABASE: 'true'
          JWT_SECRET: seed-only-placeholder-that-is-long-enough-to-validate

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Set runtime secrets
        run: |
          case "$WEB_ORIGIN" in http://*|https://*) ;; *) WEB_ORIGIN="https://$WEB_ORIGIN" ;; esac
          WEB_ORIGIN="${WEB_ORIGIN%/}"
          echo "WEB_ORIGIN=$WEB_ORIGIN"
          flyctl secrets set --stage -a miftan \
            DATABASE_URL="$DATABASE_URL" \
            WEB_ORIGIN="$WEB_ORIGIN" \
            DEMO_MODE=true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          WEB_ORIGIN: ${{ inputs.web_origin || 'https://miftan.liorkr98.workers.dev' }}

      - name: Deploy API
        run: flyctl deploy --remote-only -a miftan --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
