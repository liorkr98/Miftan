# The API on Google Cloud Run (service `miftan-api`, Frankfurt, next to the
# database). It deploys automatically after verify is green on main, and
# can be run by hand from the Actions tab. Cloud Run scales to zero when
# nobody is using it, so at this traffic it stays inside the free tier.
#
# reset-demo erases the database and reloads the demo data. It needs the
# typed confirmation, and the seed guard still refuses a database that holds
# real sign-ups (apps/api/src/db/demo-guard.ts).
#
# Secrets (Settings → Secrets and variables → Actions):
#   GCP_PROJECT_ID        the Google Cloud project id
#   GCP_SA_KEY            JSON key of the deploy service account
#   DATABASE_POOLED_URL   pooled database URL (the app's). Named for the role,
#                         not the vendor: Supabase and Neon both hand out a
#                         pooled and a direct string, and swapping provider
#                         should not mean renaming secrets. On Supabase this is
#                         the Transaction pooler (port 6543).
#   DATABASE_DIRECT_URL   direct database URL (migrations, seed, reset). A
#                         transaction-mode pooler cannot hold the session these
#                         need. On Supabase this is the Direct connection.
#   JWT_SECRET            32+ random characters
#   S3_ENDPOINT           object storage, as a whole URL. Named for the role,
#                         not the vendor, so the provider can change without
#                         renaming secrets:
#                           Cloudflare R2  https://<account>.r2.cloudflarestorage.com
#                           Supabase       https://<ref>.supabase.co/storage/v1/s3
#   S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
#   S3_REGION             optional: 'auto' suits R2, Supabase wants its region
#   S3_PUBLIC_URL         optional: the old public bucket address, so photos
#                         saved before the bucket went private still show
#   RESEND_API_KEY        optional until email is set up
#
# Until GCP_PROJECT_ID and GCP_SA_KEY exist, the job explains what is missing
# and stops without failing.

name: deploy

on:
  workflow_dispatch:
    inputs:
      data:
        description: 'keep = migrations only. reset-demo erases the database and reloads demo data.'
        type: choice
        options:
          - keep
          - reset-demo
        default: keep
      confirm:
        description: 'For reset-demo, type erase-demo-database'
        required: false
        default: ''
      web_origin:
        description: 'Web origin for CORS. Leave empty for the default.'
        required: false
        default: ''
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SERVICE: miftan-api
  REGION: europe-west3

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check that Google Cloud is configured
        id: configured
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$PROJECT" ] || [ -z "$KEY" ]; then
            echo "::notice::Deploy skipped: add GCP_PROJECT_ID and GCP_SA_KEY to the repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - if: steps.configured.outputs.ready == 'true'
        run: npm ci

      - name: Refuse a reset that was not typed out
        if: steps.configured.outputs.ready == 'true' && inputs.data == 'reset-demo'
        run: |
          if [ "$CONFIRM" != "erase-demo-database" ]; then
            echo "reset-demo requires confirm=erase-demo-database" >&2
            exit 1
          fi
        env:
          CONFIRM: ${{ inputs.confirm }}

      - name: Reset database
        if: steps.configured.outputs.ready == 'true' && inputs.data == 'reset-demo'
        run: npm run db:reset -w @miftan/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          DEMO_DATABASE: 'true'
          CONFIRM_RESET: erase-demo-database

      # Migrations run here, once, over the direct URL — before the new
      # version takes traffic. They only ever add.
      - name: Migrate
        if: steps.configured.outputs.ready == 'true'
        run: npm run db:migrate -w @miftan/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DIRECT_URL }}

      - name: Seed demo data
        if: steps.configured.outputs.ready == 'true' && inputs.data == 'reset-demo'
        run: npm run db:seed -w @miftan/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          DEMO_DATABASE: 'true'
          JWT_SECRET: seed-only-placeholder-that-is-long-enough-to-validate

      - uses: google-github-actions/auth@v2
        if: steps.configured.outputs.ready == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.configured.outputs.ready == 'true'

      # Written as a file rather than --set-env-vars: database URLs carry
      # characters (commas, ampersands) that the flag would split on. JSON is
      # valid YAML, so every value is quoted correctly.
      - name: Write runtime environment
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_POOLED_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_PUBLIC_URL: ${{ secrets.S3_PUBLIC_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEB_ORIGIN_INPUT: ${{ inputs.web_origin }}
        run: |
          node -e '
            let origin = process.env.WEB_ORIGIN_INPUT || "https://miftan.liorkr98.workers.dev";
            if (!/^https?:\/\//.test(origin)) origin = "https://" + origin;
            origin = origin.replace(/\/$/, "");
            const env = {
              DATABASE_URL: process.env.DATABASE_URL,
              JWT_SECRET: process.env.JWT_SECRET,
              WEB_ORIGIN: origin,
              COOKIE_PATH: "/auth",
              // The app is on workers.dev and this API on run.app — different
              // sites, so the refresh cookie has to be SameSite=none or the
              // browser never sends it back and every reload looks signed out.
              COOKIE_SAMESITE: "none",
              DEMO_MODE: "true",
              TZ: "Asia/Jerusalem",
            };
            for (const k of ["S3_ENDPOINT", "S3_BUCKET", "S3_ACCESS_KEY_ID", "S3_SECRET_ACCESS_KEY", "S3_REGION", "S3_PUBLIC_URL", "RESEND_API_KEY"]) {
              if (process.env[k]) env[k] = process.env[k];
            }
            const missing = ["DATABASE_URL", "JWT_SECRET", "S3_ENDPOINT", "S3_BUCKET", "S3_ACCESS_KEY_ID", "S3_SECRET_ACCESS_KEY"].filter((k) => !env[k]);
            if (missing.length) { console.error("Missing secrets: " + missing.join(", ")); process.exit(1); }
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/env.yaml", JSON.stringify(env));
            console.log("WEB_ORIGIN=" + origin);
          '

      - name: Deploy to Cloud Run
        if: steps.configured.outputs.ready == 'true'
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" \
            --region "$REGION" \
            --source . \
            --allow-unauthenticated \
            --env-vars-file "$RUNNER_TEMP/env.yaml" \
            --min-instances 0 \
            --max-instances 3 \
            --memory 512Mi \
            --cpu 1 \
            --cpu-boost \
            --concurrency 40 \
            --timeout 60 \
            --quiet

      - name: Health check
        if: steps.configured.outputs.ready == 'true'
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          echo "::notice::API address: $URL"
          echo "API address: $URL" >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 20); do
            if curl -fsS "$URL/ready"; then echo; exit 0; fi
            sleep 6
          done
          echo "::error::$URL/ready did not answer"
          exit 1
