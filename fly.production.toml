# Production API. A different Fly app and a different database from the demo
# (fly.toml / app `miftan`). DEMO_MODE is intentionally absent.
app = 'baalabait-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '4000'
  NODE_ENV = 'production'
  TZ = 'Asia/Jerusalem'
  COOKIE_PATH = '/auth'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
