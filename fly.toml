# fly.toml app configuration file generated for miftan on 2026-09-24T07:43:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'miftan'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'npx tsx src/db/migrate.ts'

[env]
  COOKIE_PATH = '/auth'
  NODE_ENV = 'production'
  PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
